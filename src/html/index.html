<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Virtual Workspace</title>

    <style>
        #lesZone {
            grid-template-areas:
                "conference . serveurs securite"
                "reception . . ."
                "reception . archives personnel";
        }
    </style>
</head>

<body class="bg-amber-50 h-screen flex flex-col items-center">

    <header class="bg-amber-50 h-20 w-full flex items-center justify-around shadow">
        <h1 class="text-2xl font-bold">Virtual Workspace</h1> <button
            class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition-colors duration-200">Add
            Profile</button>
    </header>


    <div id="lesZone"
        class="mt-4 h-[100vw] w-[100vh] lg:w-[70%] lg:h-[90vh] bg-cover bg-center bg-no-repeat grid grid-cols-[38%_17%_22%_23%] grid-rows-3 rotate-90 lg:rotate-0 relative">
        <img src="../media/plan-691a1d574bf49984751649.jpg" class="absolute w-full h-full z-[-1]" alt="">
        <div id="conference" class="zone bg-blue-800/60" style="grid-area: conference;"></div>
        <div id="serveurs" class="zone bg-blue-600/60" style="grid-area: serveurs;"></div>
        <div id="securite" class="zone bg-blue-400/60" style="grid-area: securite;"></div>
        <div id="reception" class="zone bg-blue-300/60" style="grid-area: reception;"></div>
        <div id="archives" class="zone bg-blue-100/60" style="grid-area: archives;"></div>
        <div id="personnel" class="zone bg-blue-200/60" style="grid-area: personnel;"></div>
    </div>


    <div id="AjouterData" class="absolute w-screen h-screen bg-[#00000070] flex items-center justify-center">
        <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-xl p-8 relative">
            <img id="closseCreation" src="../media/image.png" alt="closeIcone" class="fixed top-2 right-2 w-7 h-7">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Créer un Profil Personnel</h3>


                <form action="" class="p-0 flex flex-col justify-between gap-2">
                    <h4>Informations Principales</h4>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nom *</label>
                        <input type="text" id="nom"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Rôle *</label>
                        <input type="text" id="role"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="email"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Téléphone</label>
                        <input type="tel" id="telephone"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">URL Photo</label>
                        <input type="url" id="photoUrl"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Date de début</label>
                        <input type="date" id="startDate"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <button onclick="addExperience()"
                        class="flex items-center self-end px-4 py-2 bg-green-300 text-white rounded-lg hover:bg-green-500 transition-colors">
                        Ajouter l'expérience
                    </button>
                    <button onclick=""
                        class="flex items-center self-end px-4 py-2 bg-amber-300 text-white rounded-lg hover:bg-amber-500 transition-colors">
                        Save Person
                    </button>
                </form>
