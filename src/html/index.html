<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/style.css">
    <title>Virtual Workspace</title>

    <style>
        #lesZone {
            grid-template-areas:
                "conference . serveurs securite"
                "reception . . ."
                "reception . archives personnel";
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;

        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-amber-50  flex flex-col items-center">

    <header class="bg-amber-50 h-20 w-full flex items-center justify-around shadow mb-5">
        <div class="flex items-center justify-between flex-wrap gap-4">
            <div class="flex items-center gap-3">
                <div>
                    <h1 class="text-3xl font-bold gradient-text">Virtual Workspace</h1>
                    <p class="text-sm text-gray-600">Manage your team and spaces</p>
                </div>
            </div>
        </div>
        <button id="addProfile" class="bg-blue-600 text-white px-4 py-2 rounded  transition-colors duration-200">Add
            Profile</button>
    </header>

    <div class="w-[99%] h-[90vh] flex flex-col  items-center ">
        <div class="w-full border-2 rounded-[10px] p-2 md:mb-20 ">
            <div class="flex justify-around items-center">
                <h2 class="text-2xl font-bold  text-center">person</h2>
                <button id="deleteFiltrage"
                    class="bg-blue-600 text-white px-4 py-2 rounded  transition-colors duration-200 hidden">
                    delete filterage</button>
            </div>
            <div id="listPersonElemnt" class="bg-amber-50 rounded shadow shadow-amber-600 p-3 mt-3
            flex items-center flex-nowrap overflow-x-auto space-x-5 no-scrollbar min-h-15">

            </div>

        </div>
        <div id="lesZone" class="h-[95vw] w-[65vh] md:w-[90%] md:h-[90vh] xl:w-[70%]  grid grid-cols-[38%_16%_22%_22%] 
           grid-rows-3 rotate-90 md:rotate-0 relative gap-1">

            <img src="../media/plan-691a1d574bf49984751649.jpg" class="absolute w-full h-full z-[-1]" alt="">


            <div id="conference" class="zone flex justify-center items-center bg-red-300/60 p-5"
                style="grid-area: conference;">
                <div class="-rotate-90 md:rotate-0 w-full flex flex-col justify-between items-center">
                    <h1 class="text-2xl font-bold text-amber-50 text-center w-full">conference</h1>

                    <div class="w-[90%] h-[90%] grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div id="AjouterToZone" class="w-10 h-10 sm:w-15 sm:h-15 bg-gray-500/60 border-2 border-amber-200 font-bold 
                    flex justify-center items-center rounded-full">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 4v16m8-8H4" />
                            </svg>
                        </div>
                    </div>

                </div>
            </div>


            <div id="serveurs" class="zone flex justify-center items-center bg-red-300/60 p-5"
                style="grid-area: serveurs;">
                <div class="-rotate-90 md:rotate-0 w-full flex flex-col justify-between items-center">
                    <h1 class="text-2xl font-bold text-amber-50 text-center w-full">serveurs</h1>

                    <div class="w-[90%] h-[90%] grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div id="AjouterToZone" class="w-10 h-10 sm:w-15 sm:h-15 bg-gray-500/60 border-2 border-amber-200 font-bold 
                    flex justify-center items-center rounded-full">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 4v16m8-8H4" />
                            </svg>
                        </div>
                    </div>
                </div>
            </div>


            <div id="securite" class="zone flex justify-center items-center bg-red-300/60 p-5"
                style="grid-area: securite;">
                <div class="-rotate-90 md:rotate-0 w-full flex flex-col justify-between items-center">
                    <h1 class="text-2xl font-bold text-amber-50 text-center w-full">securite</h1>

                    <div class="w-[90%] h-[90%] grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div id="AjouterToZone" class="w-10 h-10 sm:w-15 sm:h-15 bg-gray-500/60 border-2 border-amber-200 font-bold 
                    flex justify-center items-center rounded-full">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 4v16m8-8H4" />
                            </svg>
                        </div>
                    </div>
                </div>
            </div>


            <div id="reception" class="zone flex justify-center items-center bg-red-300/60 p-5"
                style="grid-area: reception;">
                <div class="-rotate-90 md:rotate-0 w-full flex flex-col justify-between items-center">
                    <h1 class="text-2xl font-bold text-amber-50 text-center w-full">reception</h1>

                    <div class="w-[90%] h-[90%] grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div id="AjouterToZone" class="w-10 h-10 sm:w-15 sm:h-15 bg-gray-500/60 border-2 border-amber-200 font-bold 
                    flex justify-center items-center rounded-full">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 4v16m8-8H4" />
                            </svg>
                        </div>
                    </div>
                </div>
            </div>


            <div id="archives" class="zone flex justify-center items-center bg-red-300/60 p-5"
                style="grid-area: archives;">
                <div class="-rotate-90 md:rotate-0 w-full flex flex-col justify-between items-center">
                    <h1 class="text-2xl font-bold text-amber-50 text-center w-full">archives</h1>

                    <div class="w-[90%] h-[90%] grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div id="AjouterToZone" class="w-10 h-10 sm:w-15 sm:h-15 bg-gray-500/60 border-2 border-amber-200 font-bold 
                    flex justify-center items-center rounded-full">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 4v16m8-8H4" />
                            </svg>
                        </div>
                    </div>
                </div>
            </div>


            <div id="personnel" class="zone flex justify-center items-center bg-red-300/60 p-5"
                style="grid-area: personnel;">
                <div class="-rotate-90 md:rotate-0 w-full flex flex-col justify-between items-center">
                    <h1 class="text-2xl font-bold text-amber-50 text-center w-full">personnel</h1>

                    <div class="w-[90%] h-[90%] grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div id="AjouterToZone" class="w-10 h-10 sm:w-15 sm:h-15 bg-gray-500/60 border-2 border-amber-200 font-bold 
                    flex justify-center items-center rounded-full">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 4v16m8-8H4" />
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

        </div>


    </div>
    <div id="AjouterData"
        class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-backdrop overflow-hidden"
        style="background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);">
        <div
            class="max-w-5xl w-full bg-white rounded-3xl shadow-2xl p-8 relative max-h-[90vh] overflow-y-auto modal-content">

            <button id="closeIcone"
                class="absolute top-4 right-4 w-10 h-10 flex items-center justify-center bg-red-500 text-white rounded-full transition-all  hover:rotate-90 hover:scale-110 shadow-lg z-10">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>


            <div class="text-center mb-8">
                <h2 class="text-4xl font-bold gradient-text mb-2">Créer un Profil Personnel</h2>
                <p class="text-gray-600">Remplissez les informations ci-dessous
                </p>
            </div>

            <form class="space-y-8" id="profileForm">


                <div class="section-card bg-linear-to-br from-purple-50 to-amber-100 p-6 rounded-2xl border-2 ">
                    <h4 class="text-2xl font-bold mb-6 flex items-center">
                        ations Principales
                    </h4>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2 sm:flex items-center gap-2">
                                <span>Nom</span>
                                <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="nom"
                                class="input-focus w-full px-5 py-3 border-2  rounded-xl focus:ring- outline-none transition-all"
                                placeholder="Entrez votre nom complet">
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2 sm:flex items-center gap-2">
                                <span>Rôle</span>
                                <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="role" list="rolePerson"
                                class="input-focus w-full px-5 py-3 border-2  rounded-xl focus:ring- outline-none transition-all"
                                placeholder="Ex: Développeur Full Stack">

                            <datalist id="rolePerson">
                                <option value="Agent de sécurité">
                                <option value="Manager">
                                <option value="Technicien IT">
                                <option value="Nettoyage">
                            </datalist>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Email
                                <span class="text-red-500">*</span>
                            </label>
                            <input type="email" id="email"
                                class="input-focus w-full px-5 py-3 border-2  rounded-xl focus:ring- outline-none transition-all"
                                placeholder="exemple@email.com">
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Téléphone
                                <span class="text-red-500">*</span>
                            </label>
                            <input type="tel" id="telephone"
                                class="input-focus w-full px-5 py-3 border-2  rounded-xl focus:ring- outline-none transition-all"
                                placeholder="0 6XX XXX XXX">
                        </div>

                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-gray-700 mb-2">URL Photo de Profil</label>
                            <input type="url" id="photoUrl"
                                class="input-focus w-full px-5 py-3 border-2  rounded-xl focus:ring- outline-none transition-all"
                                placeholder="https://exemple.com/photo.jpg">
                        </div>
                    </div>
                </div>


                <div class="section-card  p-6 rounded-2xl border-2 ">
                    <h4 class="text-2xl font-bold text-gray-800 mb-6 flex items-center justify-between">
                        Expériences Professionnelles
                    </h4>

                    <div id="experiencesContainer" class="space-y-4">
                    </div>

                    <button type="button" id="addExperienceBtn"
                        class="btn-hover mt-6 px-6 py-3 bg-green-700 text-white font-bold rounded-xl shadow-lg">
                        <span class="relative z-10 flex items-center gap-2">
                            Ajouter une expérience
                        </span>
                    </button>
                </div>


                <div class="flex justify-end gap-4 pt-4">
                    <button type="submit"
                        class="btn-hover px-8 py-4 bg-linear-to-r from-amber-500 to-amber-600 text-white font-bold text-lg rounded-xl shadow-lg">
                        <span class="relative z-10 flex items-center gap-3">
                            Enregistrer le Profil
                        </span>
                    </button>
                </div>
            </form>
        </div>
    </div>



    <script type="module" src="../scripts/src/script.js"></script>
</body>

</html>
